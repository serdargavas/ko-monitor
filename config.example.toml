# Copy to config.toml and edit. config.toml is not committed.

[general]
process_name = "Client.acme"
window_title = "Knight Evolution"
data_dir = "data"
log_dir = "logs"
calibration_path = "calibration.json"

[thresholds]
tick_s = 2.0                   # fast check interval while the game is open
closed_poll_s = 10.0           # process check interval while the game is closed
snapshot_s = 60.0              # health check / snapshot interval
confirm_reads = 2              # consecutive reads for death and explicit disconnect
disconnect_soft_s = 15.0       # HUD missing this long -> disconnected
frozen_s = 120.0               # no picture change this long -> frozen
blind_s = 60.0                 # capture unusable this long -> blind
startup_grace_s = 300.0        # after launch, no dead/disconnect/frozen/blind until the HUD is first seen (at most this long)
unknown_dialog_s = 30.0        # center dialog with unrecognised text open this long while alive -> disconnected
inventory_full_repeat_s = 600.0 # aynı "çanta doldu" uyarısı bu süre dolmadan tekrarlanmaz
arrow_low = 1000               # ok bu sayının altına düşünce uyarı (~1790 ok/saat harcanıyor: ~35 dk önceden)
mana_low = 200                 # mana potu bu sayının altına düşünce uyarı (~311 pot/saat: ~35 dk önceden)
item_low_repeat_s = 600.0      # aynı ok/pot uyarısı bu süre dolmadan tekrarlanmaz
genie_off_grace_s = 120.0      # ölüm uyarısı ancak genie bu süredir kapalıysa susturulur; yeni durmuş bir bot çökmüş olabilir
income_max_jump = 50000000     # iki ölçüm arası bu farktan büyük sıçrama kazanç grafiğine katılmaz (OCR hatası)
frozen_diff_max = 0.5          # mean abs diff (0-255) of 64x36 gray frames counted as "no change"
snapshot_retention_s = 2592000 # 30 days

[items]
scroll_price = 60000           # bir scroll kaç coin ediyor; çantadaki scrollar bu fiyatla gelire sayılır

[push]
contact = "mailto:you@example.com"  # VAPID contact; use your own address
max_age_s = 300.0

[heartbeat]
ping_url = ""   # e.g. https://hc-ping.com/<uuid>; empty disables heartbeat
api_key = ""    # healthchecks.io project API key, needed to pause the check

[api]
port = 8765                 # the API/PWA listens on 127.0.0.1:<port>; publish it with `tailscale serve --bg <port>`
stream_quality = "medium"   # live view default when the phone does not choose: low | medium | high
