[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "windows-capture==2.0.1",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "rapidocr==3.9.2",
  "onnxruntime>=1.20",
  "psutil>=7.0",
  "pywebpush==2.5.0",
  "py-vapid==1.9.4",
  "httpx>=0.28",
  "cryptography>=42",
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn==0.53.0",
  "websockets==17.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: uses the real RapidOCR model (slower)"]
# Only the two known third-party deprecation notices raised while importing the test client.
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning:fastapi\\.testclient",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette\\.testclient",
]
